# =============================================================================
# Nebari Integration
# =============================================================================
# Creates a NebariApp CRD that configures routing, TLS, and auth via nebari-operator.
# Set enabled: true when deploying on a Nebari cluster.
nebariapp:
  enabled: false
  # hostname: rayserve.nebari.example.com  # Required when serve.enabled is true
  serve:
    enabled: false  # Set to true and provide nebariapp.hostname to expose the serve endpoint externally
  dashboard:
    enabled: true
    # hostname: ray-dashboard.nebari.example.com  # Separate hostname for dashboard
    landingPage:
      enabled: false
      displayName: "Ray Dashboard"
      description: "Monitor and manage Ray clusters and Serve deployments"
      icon: "https://raw.githubusercontent.com/ray-project/ray/master/doc/source/images/serve.svg"
      category: "Data Science"
      priority: 20
      healthCheck:
        enabled: true
        path: /api/component_activities
        intervalSeconds: 30
        timeoutSeconds: 5
  service:
    name: ""   # Defaults to <release>-<chart>-serve-svc (serve) or -head-svc (dashboard)
    servePort: 8000
    dashboardPort: 8265
  auth:
    enabled: false
    provider: keycloak
    provisionClient: true
    redirectURI: /oauth2/callback
    scopes:
      - openid
      - profile
      - email
    # Restrict gateway access to these Keycloak groups (empty = any
    # authenticated user). The dashboard's job API is remote code execution —
    # gate it.
    groups: []

  gateway: public

# =============================================================================
# KubeRay Operator
# =============================================================================
kuberay-operator:
  enabled: true

# =============================================================================
# Ray Serve
# =============================================================================
serve:
  # proxy_location for Ray Serve (https://docs.ray.io/en/latest/serve/architecture.html#http-proxies).
  # EveryNode places an HTTP proxy on every Ray pod, which is typically what
  # you want with KubeRay (each pod is its own scheduling unit, can ingress
  # traffic, and pod-local probes can hit localhost:8000). HeadOnly runs a
  # single proxy on the head pod — saves resources at the cost of a single
  # ingress point, useful for very large clusters. Disabled turns HTTP off
  # entirely (programmatic Serve handles only).
  proxyLocation: EveryNode

# Declarative Serve applications deployed via RayService serveConfigV2.
# Each application must specify an import_path to a module:app baked into
# the Ray image. For production, build a custom image with your model code.
#
# Example:
#   serveApplications:
#     - name: my-model
#       route_prefix: /predict
#       import_path: myapp.model:app
#       deployments:
#         - name: MyModel
#           num_replicas: 2
serveApplications: []

# =============================================================================
# Organization CA Bundle Injection
# =============================================================================
# Mount an organization-managed CA bundle into the Ray head and worker pods
# so outbound HTTPS calls (model registries, dataset URLs, Hugging Face hub,
# S3, etc.) succeed in environments running a TLS-inspecting proxy
# (Netskope, Zscaler, BlueCoat, internal corporate CAs, etc.).
#
# When `configMapName` is set, the chart adds:
#   - An initContainer that concatenates the base image's system trust store
#     (/etc/ssl/certs/ca-certificates.crt) with the deployer-supplied CA
#     (mounted from the ConfigMap at the key `ca.crt`) into
#     /shared/combined-ca.crt
#   - A shared emptyDir volume that the main container mounts read-only
#   - SSL_CERT_FILE / REQUESTS_CA_BUNDLE / CURL_CA_BUNDLE env vars on both
#     head and worker pointing at /shared/combined-ca.crt
#
# When `configMapName` is empty (default), nothing is rendered — the
# resulting RayService is byte-identical to the no-CA-injection case.
#
# Why ConfigMap rather than Secret: a CA certificate is public material
# by design (the entire PKI trust model relies on root CAs being widely
# distributed — Mozilla's bundle ships in every browser/OS, corporate
# inspecting proxy roots are pushed to every device that traverses them).
# Kubernetes itself uses a ConfigMap for the cluster's own CA distribution
# (`kube-root-ca.crt`, auto-projected into every namespace). cert-manager's
# trust-manager subproject distributes CA bundles as ConfigMaps via its
# Bundle CR. We follow that precedent here.
#
# Known coverage gap: httpx clients constructed with the default
# `verify=True` hardcode `cafile=certifi.where()` and ignore SSL_CERT_FILE.
# Application code that needs its httpx calls covered must pass
# `verify=ssl.create_default_context()` (or equivalent) explicitly.
#
# ConfigMap shape (created out-of-band, e.g. by your gitops layer):
#   apiVersion: v1
#   kind: ConfigMap
#   metadata:
#     name: org-ca-bundle
#   data:
#     ca.crt: |
#       -----BEGIN CERTIFICATE-----
#       ...your org CA...
#       -----END CERTIFICATE-----
orgCABundle:
  configMapName: ""
  # Image used by the initContainer that builds the combined CA bundle.
  # Only needs `sh` and `cat` — defaults to a tiny Alpine image.
  initImage: "alpine:3.20"

# =============================================================================
# Security
# =============================================================================
# Dedicated ServiceAccount for the Ray head and worker pods. Ray itself never
# talks to the Kubernetes API, so the token is not mounted (automount: false)
# — a compromised Ray job gets no K8s credentials. Set automount: true only
# if your serve applications genuinely need the API.
serviceAccount:
  create: true
  # Defaults to the chart fullname.
  name: ""
  automount: false

# Pod-level securityContext applied to BOTH head and worker pod specs.
# The defaults assert what the stock rayproject/ray image already does at
# runtime (user `ray`, uid 1000, gid 100), so default installs behave
# identically — but the kubelet now enforces it, and the pods satisfy the
# "restricted" Pod Security Standard. fsGroup keeps the orgCABundle shared
# emptyDir writable by the non-root initContainer.
# Running a custom image that needs root? Override with podSecurityContext: {}.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 100
  fsGroup: 100
  seccompProfile:
    type: RuntimeDefault

# Container-level securityContext for the ray-head and ray-worker containers.
# readOnlyRootFilesystem is deliberately NOT set: Ray writes logs, object
# spilling, and runtime envs under /tmp/ray.
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# NetworkPolicy allow-listing for the Ray pods. Ray has NO native
# authentication on the client port (10001), GCS (6379), or dashboard/job
# API (8265) — any pod that can reach them can execute arbitrary code on the
# cluster. With enabled: true, ingress to Ray pods is restricted to:
#   - other Ray pods in this namespace (inter-node traffic uses many
#     ephemeral ports, so this is allow-all between Ray pods)
#   - the kuberay-operator (dashboard API 8265, dashboard agent 52365,
#     serve 8000 — required or RayService never reconciles)
#   - the Envoy Gateway namespace(s) below → head 8265 + 8000 (the NebariApp
#     path for dashboard/serve hostnames)
#   - explicitly allow-listed cross-namespace clients (see allowedClients)
# Egress is deliberately NOT restricted: Ray workloads legitimately fetch
# models, datasets, and packages (that's why orgCABundle exists); the threat
# model here is inbound access to unauthenticated ports.
# NOTE: your CNI must enforce NetworkPolicy (Calico, Cilium, ...). kind's
# default kindnet does NOT.
networkPolicy:
  enabled: false
  # Namespace(s) hosting the Envoy Gateway data plane, matched via the
  # kubernetes.io/metadata.name auto-label (k8s >= 1.21). MUST be verified
  # per cluster:  kubectl get pods -A -o wide | grep -i envoy
  gatewayNamespaces:
    - envoy-gateway-system
  # Cross-namespace clients allowed to reach the Ray head. Each entry:
  #   namespace: <name>          (required — matched via metadata.name label)
  #   podSelector: {...}         (optional — restricts to matching pods)
  #   ports: [10001, ...]        (optional — defaults to [10001, 8000, 8265])
  # Examples:
  #   - namespace: checkmaite        # checkmaite api: Ray client only
  #     podSelector:
  #       matchLabels:
  #         app.kubernetes.io/component: api
  #     ports: [10001]
  #   - namespace: jupyter           # data-science-pack notebooks
  #     ports: [10001, 8000, 8265]
  allowedClients: []
  # Extra raw ingress rules appended verbatim to the head policy (e.g.
  # Prometheus scraping metrics from a monitoring namespace).
  extraIngress: []

# Opt-in namespace ResourceQuota. Deploy one RayService per team namespace
# and cap the blast radius here.
# WARNING: size for TWO full clusters — RayService zero-downtime upgrades run
# the old and new RayCluster simultaneously; a tight quota wedges upgrades.
resourceQuota:
  enabled: false
  hard:
    requests.cpu: "16"
    requests.memory: 64Gi
    limits.cpu: "32"
    limits.memory: 128Gi
    # requests.nvidia.com/gpu: "4"

# Opt-in namespace LimitRange — default requests/limits for containers that
# don't set their own (head/worker and the kuberay-operator all set explicit
# resources, so this only catches ad-hoc pods in the namespace).
limitRange:
  enabled: false
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      default:
        cpu: "1"
        memory: 2Gi

# =============================================================================
# Ray Image
# =============================================================================
# Used for both head and worker nodes. For production, build a custom image
# with your model code and dependencies pre-installed.
image:
  repository: rayproject/ray
  tag: 2.43.0

# Ray version advertised to KubeRay (spec.rayClusterConfig.rayVersion). Falls
# back to image.tag, which is only correct for stock rayproject/ray images —
# set this explicitly when image.tag is not a Ray version (custom images).
rayVersion: ""

# =============================================================================
# Ray Head
# =============================================================================
head:
  # runtimeClassName: nvidia  # Set for GPU-enabled head nodes
  # Pin the head to a dedicated node pool for scheduling isolation.
  nodeSelector: {}
  affinity: {}
  priorityClassName: ""
  containerEnv: []
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"
    requests:
      cpu: "1"
      memory: "2Gi"

  # Extra tolerations for the head pod. The nvidia.com/gpu toleration is
  # injected automatically when resources above request nvidia.com/gpu, so
  # GPU pods schedule onto nodes tainted nvidia.com/gpu=...:NoSchedule. Add
  # any additional tolerations here.
  tolerations: []

  # Head pod readiness/liveness probes. Defaults to {} which lets KubeRay
  # apply its built-in probes. Override here to set explicit probes; see
  # the worker.readinessProbe / worker.livenessProbe block below for the
  # rationale and a concrete example.
  readinessProbe: {}
  livenessProbe: {}

  # Extra pod volumes / container volumeMounts appended after any
  # orgCABundle-generated entries (e.g. a shared artifact directory that
  # workloads write and an external consumer reads).
  extraVolumes: []
  extraVolumeMounts: []

# =============================================================================
# Ray Workers
# =============================================================================
worker:
  replicas: 1
  minReplicas: 1
  maxReplicas: 1
  # runtimeClassName: nvidia  # Set for GPU-enabled worker nodes
  # Pin workers to a dedicated node pool for scheduling isolation.
  nodeSelector: {}
  affinity: {}
  priorityClassName: ""
  containerEnv: []
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"
    requests:
      cpu: "1"
      memory: "2Gi"

  # Extra tolerations for worker pods. The nvidia.com/gpu toleration is
  # injected automatically when resources above request nvidia.com/gpu, so
  # GPU workers schedule onto nodes tainted nvidia.com/gpu=...:NoSchedule.
  # Add any additional tolerations here.
  tolerations: []

  # Worker pod readiness/liveness probes.
  #
  # KubeRay's default worker probes chain a raylet healthz check with
  # `wget http://localhost:8000/-/healthz | grep success`. The Serve check
  # requires both a deployed Serve application and a local Serve HTTP proxy,
  # neither of which holds on a fresh cluster (default serveApplications is
  # empty, default Ray Serve proxy_location varies by Ray version). When the
  # Serve check fails the worker pod stays 0/1 Ready forever.
  #
  # The defaults below check raylet healthz alone — the Ray node is Ready
  # when its raylet is healthy. Serve application health is tracked by the
  # Serve controller and need not gate K8s pod readiness; the chart's
  # serve-svc Service targets only the head pod, so worker readiness has no
  # effect on user-visible HTTP routing.
  #
  # Set either probe to null (~ in YAML) to suppress it and let KubeRay's
  # default apply. Setting to {} won't suppress — Helm's deep merge keeps
  # existing keys when overlaying with an empty map.
  # See https://github.com/nebari-dev/nebari-rayserve-pack/issues/7 for the
  # full diagnosis.
  readinessProbe:
    exec:
      command:
        - bash
        - -c
        - "wget -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success"
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 1
  livenessProbe:
    exec:
      command:
        - bash
        - -c
        - "wget -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success"
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 120

  # Extra pod volumes / container volumeMounts appended after any
  # orgCABundle-generated entries (e.g. a shared artifact directory that
  # workloads write and an external consumer reads).
  extraVolumes: []
  extraVolumeMounts: []

# =============================================================================
# Overrides
# =============================================================================
nameOverride: ""
fullnameOverride: ""
