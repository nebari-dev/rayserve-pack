{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nebari-rayserve.serviceAccountName" . }}
  labels:
    {{- include "nebari-rayserve.labels" . | nindent 4 }}
# Ray never talks to the Kubernetes API; don't hand its pods a token.
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
