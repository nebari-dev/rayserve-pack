apiVersion: ray.io/v1
kind: RayService
metadata:
  name: {{ include "nebari-rayserve.fullname" . }}
  labels:
    {{- include "nebari-rayserve.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  # Serve config — declares applications to deploy.
  # Empty by default; users add applications via values or deploy at runtime
  # via the Ray Dashboard REST API.
  serveConfigV2: |
    proxy_location: {{ .Values.serve.proxyLocation }}
    http_options:
      host: "0.0.0.0"
      port: 8000
    applications: {{ .Values.serveApplications | default list | toJson }}

  rayClusterConfig:
    rayVersion: {{ .Values.rayVersion | default .Values.image.tag | quote }}
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
      template:
        spec:
          serviceAccountName: {{ include "nebari-rayserve.serviceAccountName" . }}
          automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.head.runtimeClassName }}
          runtimeClassName: {{ . }}
          {{- end }}
          {{- with .Values.head.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.head.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.head.priorityClassName }}
          priorityClassName: {{ . }}
          {{- end }}
          {{- with (include "nebari-rayserve.orgCABundle.initContainers" .) }}
          initContainers:
            {{- . | nindent 12 }}
          {{- end }}
          {{- $headVolumes := concat (.Values.head.extraVolumes | default list) (fromYamlArray (include "nebari-rayserve.orgCABundle.volumes" .)) }}
          {{- with $headVolumes }}
          volumes:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (include "nebari-rayserve.tolerations" .Values.head) }}
          tolerations:
            {{- . | nindent 12 }}
          {{- end }}
          containers:
            - name: ray-head
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              {{- with .Values.containerSecurityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- $headEnv := concat (.Values.head.containerEnv | default list) (fromYamlArray (include "nebari-rayserve.orgCABundle.env" .)) }}
              {{- with $headEnv }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- $headMounts := concat (.Values.head.extraVolumeMounts | default list) (fromYamlArray (include "nebari-rayserve.orgCABundle.volumeMounts" .)) }}
              {{- with $headMounts }}
              volumeMounts:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              resources:
                {{- toYaml .Values.head.resources | nindent 16 }}
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
                - containerPort: 8000
                  name: serve
              {{- with .Values.head.readinessProbe }}
              readinessProbe:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.head.livenessProbe }}
              livenessProbe:
                {{- toYaml . | nindent 16 }}
              {{- end }}
    workerGroupSpecs:
      - replicas: {{ .Values.worker.replicas }}
        minReplicas: {{ .Values.worker.minReplicas | default .Values.worker.replicas }}
        maxReplicas: {{ .Values.worker.maxReplicas | default .Values.worker.replicas }}
        groupName: workers
        rayStartParams: {}
        template:
          spec:
            serviceAccountName: {{ include "nebari-rayserve.serviceAccountName" . }}
            automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
            {{- with .Values.podSecurityContext }}
            securityContext:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.worker.runtimeClassName }}
            runtimeClassName: {{ . }}
            {{- end }}
            {{- with .Values.worker.nodeSelector }}
            nodeSelector:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.worker.affinity }}
            affinity:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.worker.priorityClassName }}
            priorityClassName: {{ . }}
            {{- end }}
            {{- with (include "nebari-rayserve.orgCABundle.initContainers" .) }}
            initContainers:
              {{- . | nindent 14 }}
            {{- end }}
            {{- $workerVolumes := concat (.Values.worker.extraVolumes | default list) (fromYamlArray (include "nebari-rayserve.orgCABundle.volumes" .)) }}
            {{- with $workerVolumes }}
            volumes:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with (include "nebari-rayserve.tolerations" .Values.worker) }}
            tolerations:
              {{- . | nindent 14 }}
            {{- end }}
            containers:
              - name: ray-worker
                image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
                {{- with .Values.containerSecurityContext }}
                securityContext:
                  {{- toYaml . | nindent 18 }}
                {{- end }}
                {{- $workerEnv := concat (.Values.worker.containerEnv | default list) (fromYamlArray (include "nebari-rayserve.orgCABundle.env" .)) }}
                {{- with $workerEnv }}
                env:
                  {{- toYaml . | nindent 18 }}
                {{- end }}
                {{- $workerMounts := concat (.Values.worker.extraVolumeMounts | default list) (fromYamlArray (include "nebari-rayserve.orgCABundle.volumeMounts" .)) }}
                {{- with $workerMounts }}
                volumeMounts:
                  {{- toYaml . | nindent 18 }}
                {{- end }}
                resources:
                  {{- toYaml .Values.worker.resources | nindent 18 }}
                {{- with .Values.worker.readinessProbe }}
                readinessProbe:
                  {{- toYaml . | nindent 18 }}
                {{- end }}
                {{- with .Values.worker.livenessProbe }}
                livenessProbe:
                  {{- toYaml . | nindent 18 }}
                {{- end }}
